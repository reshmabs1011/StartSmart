{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <span class="eyebrow">WELCOME BACK</span><h1>Log in</h1>
    <p class="muted">Your next step can be a small one.</p>
    <form method="post">
      <label>Email address<input type="email" name="email" required autocomplete="email"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="button primary full" type="submit">Log in</button>
    </form>
    <p class="form-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
